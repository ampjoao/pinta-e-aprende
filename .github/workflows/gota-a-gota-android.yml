# Gota a Gota: APK Android. Descarregar em Actions → "Gota a Gota · Android" → Artifacts.
# O endereço do servidor vem da variável do repositório GOTA_A_GOTA_API_URL (Settings → Variables).
name: Gota a Gota · Android

on:
  push:
    branches: [main]
    paths: ['gota-a-gota/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: gota-a-gota

env:
  VITE_API_URL: ${{ vars.GOTA_A_GOTA_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#a95c33' --splashBackgroundColor '#f7f2ea'
      - run: npx cap sync android
      - name: Build APK
        working-directory: gota-a-gota/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gota-a-gota-android
          path: gota-a-gota/android/app/build/outputs/apk/debug/*.apk
