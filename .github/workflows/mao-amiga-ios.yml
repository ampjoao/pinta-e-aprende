# Mão Amiga: confirma que a app iOS compila (simulador). Para iPhone e App Store é
# preciso uma conta Apple Developer (ver mao-amiga/README.md).
name: Mão Amiga · iOS

on:
  push:
    branches: [main]
    paths: ['mao-amiga/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: mao-amiga

env:
  VITE_API_URL: ${{ vars.MAO_AMIGA_API_URL }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios --iconBackgroundColor '#c93f6b' --splashBackgroundColor '#fdf7f8'
      - run: npx cap sync ios
      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: mao-amiga-ios-simulator
          path: mao-amiga/build/Build/Products/Debug-iphonesimulator/*.app
