# Gota a Gota: confirma que a app iOS compila (simulador). Para iPhone e App Store é
# preciso uma conta Apple Developer (ver gota-a-gota/README.md).
name: Gota a Gota · iOS

on:
  push:
    branches: [main]
    paths: ['gota-a-gota/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: gota-a-gota

env:
  VITE_API_URL: ${{ vars.GOTA_A_GOTA_API_URL }}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios --iconBackgroundColor '#a95c33' --splashBackgroundColor '#f7f2ea'
      - run: npx cap sync ios
      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: gota-a-gota-ios-simulator
          path: gota-a-gota/build/Build/Products/Debug-iphonesimulator/*.app
