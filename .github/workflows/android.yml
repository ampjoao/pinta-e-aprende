# Gera a app Android (APK para instalar diretamente). Descarregar em Actions → Android → Artifacts.
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ff8a3d' --splashBackgroundColor '#fff7e6'
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pinta-e-aprende-android
          path: android/app/build/outputs/apk/debug/*.apk
