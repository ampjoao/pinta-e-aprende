# Mão Amiga: APK Android. Descarregar em Actions → "Mão Amiga · Android" → Artifacts.
# O endereço do servidor vem da variável do repositório MAO_AMIGA_API_URL (Settings → Variables).
name: Mão Amiga · Android

on:
  push:
    branches: [main]
    paths: ['mao-amiga/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: mao-amiga

env:
  VITE_API_URL: ${{ vars.MAO_AMIGA_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#c93f6b' --splashBackgroundColor '#fdf7f8'
      - run: npx cap sync android
      - name: Build APK
        working-directory: mao-amiga/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mao-amiga-android
          path: mao-amiga/android/app/build/outputs/apk/debug/*.apk
