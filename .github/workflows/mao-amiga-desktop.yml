# Mão Amiga: instaladores Windows (.msi/.exe) e Mac (.dmg).
# Descarregar em Actions → "Mão Amiga · Windows e Mac" → Artifacts.
name: Mão Amiga · Windows e Mac

on:
  push:
    branches: [main]
    paths: ['mao-amiga/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: mao-amiga

env:
  VITE_API_URL: ${{ vars.MAO_AMIGA_API_URL }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mao-amiga/src-tauri
      - run: npm install
      - run: npx tauri icon assets/logo.png
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: mao-amiga-${{ matrix.name }}
          path: |
            mao-amiga/src-tauri/target/**/bundle/msi/*.msi
            mao-amiga/src-tauri/target/**/bundle/nsis/*.exe
            mao-amiga/src-tauri/target/**/bundle/dmg/*.dmg
