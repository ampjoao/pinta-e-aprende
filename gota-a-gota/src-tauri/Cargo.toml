[package]
name = "gota-a-gota"
version = "0.1.0"
description = "Gota a Gota"
edition = "2021"

[lib]
name = "gota_a_gota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
